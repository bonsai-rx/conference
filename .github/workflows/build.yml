name: Build website

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout 2024
        uses: actions/checkout@v7
        with:
          ref: "2024"
          path: "./editions/2024"

      - name: Checkout 2026
        uses: actions/checkout@v7
        with:
          ref: "2026"
          path: "./editions/2026"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build 2024
        uses: actions/jekyll-build-pages@v1
        with:
          source: "./editions/2024"
          destination: "./site/2024"

      - name: Build 2026
        uses: actions/jekyll-build-pages@v1
        with:
          source: "./editions/2026"
          destination: "./site/2026"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./site"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
        id: deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
